name: tests

# Ultra-light CI: lint runs ruff, test runs the suite on the always-available
# core install (no compiled ANN engines needed — backend-specific tests skip
# cleanly when their optional dependency is absent, by design; see
# tests/test_backends.py). The `package` job below only runs when `test`
# succeeds: GitHub Actions skips (never fails) a job whose `needs:` dependency
# failed, so a red X there can only ever come from the test job itself.

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: ann-router capabilities
      - run: ann-router route --n-vectors 1000 --dim 64

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import ann_router"
