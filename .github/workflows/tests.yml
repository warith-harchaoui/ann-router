name: tests

# Ultra-light CI: one job runs the suite on the always-available core install
# (no compiled ANN engines needed — backend-specific tests skip cleanly when
# their optional dependency is absent, by design; see tests/test_backends.py).
# The `package` job below only runs when `test` succeeds: GitHub Actions skips
# (never fails) a job whose `needs:` dependency failed, so a red X can only
# ever come from the test job itself.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: ann-router capabilities
      - run: ann-router route --n-vectors 1000 --dim 64
