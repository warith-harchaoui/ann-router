<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1463 432" width="1463" height="432" role="img" aria-labelledby="ar-title ar-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ar-title">How ann-router works: your search problem in, the backend that suits it out — with the reasoning attached</title>
  <desc id="ar-desc">A left-to-right plate. In: the shape of your nearest-neighbour problem — how many vectors, how many dimensions, the recall you need, the latency you can afford, and whether a server is acceptable. The work, in three numbered stages: those criteria are measured rather than assumed, including the one most people skip, which is how small the collection actually is; every candidate backend is scored against them, exact search, turbovec, HNSW, FAISS, Annoy, Qdrant and pgvector; and the choice is justified in words naming the threshold that decided it. Out: the backend to use, plus a rationale you can argue with. The caption records the answer nobody expects.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="230" height="78" rx="10"/>
  <text class="n-title" x="143" y="120" text-anchor="middle">your search problem</text>
  <text class="n-sub" x="143" y="139" text-anchor="middle">n, dimensions, recall, latency</text>
  <path class="flow" d="M264 126 H280" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="284" y="54" width="862" height="144" rx="12"/>
  <text class="panel-label" x="304" y="76">WHAT IT DOES</text>
  <rect class="stage" x="304" y="94" width="237" height="78" rx="10"/>
  <text class="n-title" x="423" y="127" text-anchor="middle">measure the criteria</text>
  <text class="n-sub" x="423" y="146" text-anchor="middle">including how small n really is</text>
  <text class="step" x="315" y="110">1</text>
  <path class="flow" d="M545 133 H561" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="567" y="94" width="283" height="78" rx="10"/>
  <text class="n-title" x="709" y="127" text-anchor="middle">score the backends</text>
  <text class="n-sub" x="709" y="146" text-anchor="middle">exact, HNSW, FAISS, Qdrant, pgvector…</text>
  <text class="step" x="578" y="110">2</text>
  <path class="flow" d="M854 133 H870" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="876" y="94" width="250" height="78" rx="10"/>
  <text class="n-title" x="1001" y="127" text-anchor="middle">justify the choice</text>
  <text class="n-sub" x="1001" y="146" text-anchor="middle">naming the threshold that decided</text>
  <text class="step" x="887" y="110">3</text>
  <path class="flow" d="M1152 126 H1168" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1172" y="40">OUT</text>
  <rect class="io" x="1172" y="87" width="263" height="78" rx="10"/>
  <text class="n-title" x="1303" y="120" text-anchor="middle">the backend to use</text>
  <text class="n-sub" x="1303" y="139" text-anchor="middle">plus a rationale you can argue with</text>
  <rect class="core" x="516" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="731" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="731" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M731 286 V314 H467 V332"/>
  <path class="tie" d="M731 314 H995 V332"/>
  <path class="tie" d="M467 314 V332"/>
  <rect class="surface" x="392" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="467" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M643 314 V332"/>
  <rect class="surface" x="568" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="643" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M819 314 V332"/>
  <rect class="surface" x="744" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="819" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M995 314 V332"/>
  <rect class="surface" x="920" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="995" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="731" y="412" text-anchor="middle">Below a surprisingly large collection the honest answer is exact search: no index, no server, and nothing to get stale.</text>
</svg>
